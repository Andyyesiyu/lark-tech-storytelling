<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="use-iframe" content="true">
  <meta name="html-box-height-mode" content="auto">
  <meta name="description" content="系统多域协同与分步流转交互式动画（支持单模式全景演进或双模式方案对比）">
  <title>交互式系统流转全景</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #ffffff;
      color: #1f2328;
      padding: 12px;
      width: 100%;
      max-width: 100%;
    }
    .card {
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      padding: 14px 16px;
      width: 100%;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .title {
      font-size: 14px;
      font-weight: 600;
      color: #1f2328;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      color: #0969da;
      background: #ddf4ff;
      border: 1px solid rgba(9, 105, 218, 0.25);
      border-radius: 999px;
      padding: 2px 8px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .steps {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .step-btn {
      appearance: none;
      border: 1px solid #d0d7de;
      background: #ffffff;
      color: #57606a;
      font-size: 12px;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .step-btn:hover {
      border-color: #0969da;
      color: #0969da;
    }
    .mode-switch {
      display: inline-flex;
      background: #eaeef2;
      border-radius: 7px;
      padding: 2px;
      gap: 2px;
    }
    .mode-switch.hidden {
      display: none;
    }
    .mode-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: #57606a;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .desc-box {
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-left: 4px solid #0969da;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 12px;
      min-height: 56px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }
    .desc-title {
      font-size: 13px;
      font-weight: 600;
      color: #0969da;
    }
    .desc-text {
      font-size: 12.5px;
      color: #1f2328;
      line-height: 1.5;
    }
    .canvas-wrap {
      background-color: #ffffff;
      background-image: radial-gradient(#d8dee4 1px, transparent 1px);
      background-size: 16px 16px;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      overflow: hidden;
      width: 100%;
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -20; }
    }
    .anim-dash {
      stroke-dasharray: 6 4;
      animation: dashMove 0.9s linear infinite;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top-bar">
      <div class="title-group">
        <span class="title" id="diagram-title">🔄 控制面 ⇄ 执行面分步协同与平滑接力</span>
        <span class="badge" id="play-status">自动轮播中</span>
      </div>
      <div class="controls">
        <div class="steps" id="step-btns"></div>
        <!-- 若仅需单模式全景展示，在脚本中只保留 1 个 mode 即可自动隐藏切换器 -->
        <div class="mode-switch" id="mode-switch"></div>
      </div>
    </div>

    <div class="desc-box" id="desc-box">
      <div class="desc-title" id="desc-title"></div>
      <div class="desc-text" id="desc-text"></div>
    </div>

    <div class="canvas-wrap">
      <!--
        预留槽位布局规范（Zero Overflow）：
        - Y: 12..40   顶部焦点状态横幅槽位（28px 独立高度，不与下方分区重叠）
        - Y: 52..318  三栏分区卡片（控制域 / 协调域 / 执行域）
        - 若为上下跨层布局，中间需同样预留 28px 独立横幅槽位用于展示跨层契约或边界
      -->
      <svg viewBox="0 0 760 332" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#0969da"/>
          </marker>
          <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#8250df"/>
          </marker>
          <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#9a6700"/>
          </marker>
          <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#1a7f37"/>
          </marker>
          <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#cf222e"/>
          </marker>
        </defs>

        <!-- Slot 1: Top Focus Banner (Y: 12..40) -->
        <rect id="top-pill-bg" x="16" y="12" width="728" height="28" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
        <text id="top-pill-text" x="380" y="30" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0969da"></text>

        <!-- Zone 1: Left Column (X: 16..236, Y: 52..318) -->
        <rect x="16" y="52" width="220" height="266" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="4 3"/>
        <text x="28" y="70" font-size="11" font-weight="600" fill="#57606a">1. 控制面与产物源 (Control Plane)</text>

        <rect id="box-ctrl" x="28" y="84" width="196" height="96" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
        <text x="126" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">控制面服务</text>
        <text id="ctrl-l1" x="126" y="128" text-anchor="middle" font-size="10.5" fill="#57606a">实例注册 / 周期心跳</text>
        <text id="ctrl-l2" x="126" y="146" text-anchor="middle" font-size="10.5" fill="#57606a">版本比对与策略下发</text>
        <text id="ctrl-l3" x="126" y="164" text-anchor="middle" font-size="10.5" fill="#0969da">审计与健康度收敛</text>

        <rect id="box-store" x="28" y="198" width="196" height="102" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
        <text x="126" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">版本产物仓库</text>
        <text id="store-l1" x="126" y="244" text-anchor="middle" font-size="10.5" fill="#57606a">按 SHA-256 寻址产包</text>
        <text id="store-l2" x="126" y="262" text-anchor="middle" font-size="10.5" fill="#57606a">包含核心运行时与插件</text>

        <!-- Zone 2: Center Column (X: 256..504, Y: 52..318) -->
        <rect x="256" y="52" width="248" height="266" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="4 3"/>
        <text x="268" y="70" font-size="11" font-weight="600" fill="#57606a">2. 宿主常驻协调层 (Host Coordinator)</text>

        <rect id="box-sup" x="270" y="84" width="220" height="64" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
        <text x="380" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">外层守护进程 Supervisor</text>
        <text id="sup-l1" x="380" y="128" text-anchor="middle" font-size="10.5" fill="#57606a">常驻监控 · 优先加载动态软链</text>

        <rect id="box-agent" x="270" y="164" width="220" height="72" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
        <text id="agent-title" x="380" y="186" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">内层协调器 Runner</text>
        <text id="agent-l1" x="380" y="205" text-anchor="middle" font-size="10.5" fill="#57606a">上报状态摘要与活跃度</text>
        <text id="agent-l2" x="380" y="222" text-anchor="middle" font-size="10.5" fill="#0969da">负责拉包校验与平滑交接</text>

        <rect id="box-engine" x="270" y="250" width="220" height="54" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
        <text x="380" y="272" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">业务执行引擎 Server</text>
        <text id="engine-l1" x="380" y="290" text-anchor="middle" font-size="10.5" fill="#57606a">处理长连接会话与工具调度</text>

        <!-- Zone 3: Right Column (X: 524..744, Y: 52..318) -->
        <rect x="524" y="52" width="220" height="266" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="4 3"/>
        <text x="536" y="70" font-size="11" font-weight="600" fill="#57606a">3. 落盘目录与工作区 (Runtime &amp; Worker)</text>

        <rect id="box-slot" x="536" y="84" width="196" height="64" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
        <text x="634" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">版本目录与软链</text>
        <text id="slot-l1" x="634" y="128" text-anchor="middle" font-size="10.5" fill="#57606a">current -&gt; versions/&lt;ver&gt;</text>

        <rect id="box-shared" x="536" y="164" width="196" height="72" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
        <text x="634" y="186" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">共享只读插件区</text>
        <text id="shared-l1" x="634" y="205" text-anchor="middle" font-size="10.5" fill="#57606a">按摘要隔离落盘</text>
        <text id="shared-l2" x="634" y="222" text-anchor="middle" font-size="10.5" fill="#1a7f37">自动清理历史旧目录</text>

        <rect id="box-worker" x="536" y="250" width="196" height="54" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
        <text x="634" y="272" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">沙箱子进程 Worker</text>
        <text id="worker-l1" x="634" y="290" text-anchor="middle" font-size="10.5" fill="#57606a">按优先级挂载共享插件</text>

        <!-- Flow Lines -->
        <line id="line-ctrl-agent" x1="224" y1="132" x2="266" y2="190" stroke="#0969da" stroke-width="2" marker-end="url(#arr-blue)"/>
        <line id="line-store-slot" x1="224" y1="240" x2="532" y2="120" stroke="#8250df" stroke-width="2" marker-end="url(#arr-purple)"/>
        <line id="line-sup-agent" x1="380" y1="148" x2="380" y2="160" stroke="#9a6700" stroke-width="2" marker-end="url(#arr-amber)"/>
        <line id="line-agent-engine" x1="380" y1="236" x2="380" y2="246" stroke="#0969da" stroke-width="2" marker-end="url(#arr-blue)"/>
        <line id="line-slot-sup" x1="536" y1="116" x2="494" y2="116" stroke="#1a7f37" stroke-width="2" marker-end="url(#arr-green)"/>
        <line id="line-agent-shared" x1="490" y1="200" x2="532" y2="200" stroke="#1a7f37" stroke-width="2" marker-end="url(#arr-green)"/>
        <line id="line-shared-worker" x1="634" y1="236" x2="634" y2="246" stroke="#1a7f37" stroke-width="2" marker-end="url(#arr-green)"/>
        <line id="line-engine-worker" x1="490" y1="277" x2="532" y2="277" stroke="#1a7f37" stroke-width="2" marker-end="url(#arr-green)"/>
      </svg>
    </div>
  </div>

  <script>
    /**
     * 通用配置结构：
     * - 若只需展示单一流程（如「第 1 节：架构全景流转」），MODES 数组只放 1 个对象即可，右上角模式切换器会自动隐藏。
     * - 若需展示双态对比（如「演进前 vs 演进后」、「方案 A vs 方案 B」、「异常态 vs 修复态」），在 MODES 中配置 2 个对象即可。
     */
    const MODES = [
      {
        key: "flow",
        label: "✨ 协同主流程",
        activeBg: "#ddf4ff",
        activeColor: "#0969da",
        steps: [
          {
            btnLabel: "1. 注册与就绪",
            color: "#0969da",
            pillBg: "#ddf4ff",
            pillText: "📡 Step 1 焦点：协调器拉起业务引擎并向控制面完成注册报到",
            title: "Step 1 / 4：实例启动注册与本地服务就绪",
            text: "外层守护进程拉起协调器 Runner，Runner 初始化本地 RPC 监听、拉取运行凭据并启动业务执行引擎 Server，随后向控制面完成注册。",
            boxes: ["box-ctrl", "box-agent", "box-engine"],
            lines: ["line-ctrl-agent", "line-agent-engine"],
            labels: {
              "sup-l1": "常驻监控 · 记录进程组 PGID",
              "agent-title": "内层协调器 Runner (运行中)",
              "agent-l1": "完成控制面 register 报到",
              "agent-l2": "拉起并看管业务引擎 Server",
              "engine-l1": "监听本地端口 · 接收会话请求"
            }
          },
          {
            color: "#8250df",
            btnLabel: "2. 心跳与比对",
            pillBg: "#fbefff",
            pillText: "💓 Step 2 焦点：周期性上报版本摘要，控制面按需下发新版本目标",
            title: "Step 2 / 4：周期心跳同步状态，控制面比对摘要下发更新指令",
            text: "Runner 周期性上报当前落盘的版本摘要与会话活跃度。控制面比对目标通道的最新产物摘要，若发现版本落后则在心跳回包中下发产物地址与目标摘要。",
            boxes: ["box-ctrl", "box-store", "box-agent", "box-slot"],
            lines: ["line-ctrl-agent", "line-store-slot"],
            labels: {
              "sup-l1": "保持外层事件循环常驻",
              "agent-title": "内层协调器 Runner (收到新版本)",
              "agent-l1": "上报当前摘要 + 活跃会话",
              "agent-l2": "收到新产物 URL 与目标 SHA-256",
              "slot-l1": "准备拉取并解压新版本目录"
            }
          },
          {
            color: "#9a6700",
            btnLabel: "3. 原子切软链",
            pillBg: "#fff8c5",
            pillText: "🔄 Step 3 焦点：解压校验后原子切换 current 软链，旧协调器主动优雅退出",
            title: "Step 3 / 4：原子切换软链并优雅停机，外层守护进程清理进程组",
            text: "Runner 下载产物包并校验 SHA-256 后，将 current 软链原子指向新版本目录，随后主动停止定时器与旧业务引擎并退出；外层 Supervisor 清理残留进程组确保端口释放。",
            boxes: ["box-sup", "box-agent", "box-engine", "box-slot"],
            lines: ["line-store-slot", "line-sup-agent", "line-agent-engine"],
            labels: {
              "sup-l1": "捕获退出 -> 清理旧进程组",
              "agent-title": "旧 Runner (优雅停机退出)",
              "agent-l1": "1. 原子切换 current 软链",
              "agent-l2": "2. 停定时器 + 通知引擎退出",
              "engine-l1": "优雅关闭连接并释放端口",
              "slot-l1": "current 已指向最新版本"
            }
          },
          {
            color: "#1a7f37",
            btnLabel: "4. 接力与闭环",
            pillBg: "#dafbe1",
            pillText: "🚀 Step 4 焦点：从新软链拉起新版协调器，同步共享插件并在下次心跳完成闭环",

            text: "外层 Supervisor 从更新后的 current 软链拉起新版 Runner，将配套插件转存至全局可读共享区并清理旧目录，拉起新版 Server 后在下轮心跳向控制面确认升级成功。",
            boxes: ["box-sup", "box-agent", "box-engine", "box-slot", "box-shared", "box-worker"],
            lines: ["line-slot-sup", "line-sup-agent", "line-agent-shared", "line-shared-worker", "line-engine-worker"],
            labels: {
              "sup-l1": "从 current 软链拉起新版入口",

              "agent-l2": "下次心跳上报新摘要 -> 闭环",

              "worker-l1": "加载最新共享插件执行任务"
            }
          }
        ]
      },
      {
        key: "compare",
        label: "🔍 传统重启对比",
        activeBg: "#fff8c5",
        activeColor: "#9a6700",
        steps: [
          {
            btnLabel: "1. 镜像固化",
            color: "#9a6700",
            pillBg: "#fff8c5",

            title: "传统模式 1 / 4：代码与插件随容器镜像静态打包",
            text: "所有服务代码与插件直接固化在基础镜像内，实例运行期间无法独立替换内部组件版本。",
            boxes: ["box-sup", "box-agent", "box-engine"],
            lines: ["line-sup-agent", "line-agent-engine"],
            labels: {
              "sup-l1": "仅加载镜像内置固定入口",

            }
          },
          {
            btnLabel: "2. 升级需重建",
            color: "#cf222e",
            pillBg: "#ffebe9",
            pillText: "⚠️ 传统模式 Step 2：任何小版本升级都需要销毁并重建整台容器实例",
            title: "传统模式 2 / 4：升级必须触发整机容器重建",
            text: "当发布新版本或修复问题时，控制面必须下发容器销毁重建指令，中断当前实例上的所有本地进程上下文。",
            boxes: ["box-ctrl", "box-sup", "box-engine"],
            lines: ["line-ctrl-agent"],
            labels: {
              "sup-l1": "整机容器收到销毁信号",
              "agent-title": "实例销毁重建中",
              "agent-l1": "本地内存态与临时进程全部中断",
              "agent-l2": "等待调度器重新分配容器",
              "engine-l1": "长连接断开"
            }
          },
          {
            btnLabel: "3. 冷启动耗时",
            color: "#9a6700",
            pillBg: "#fff8c5",
            pillText: "⏳ 传统模式 Step 3：拉取完整大镜像与重新初始化环境耗时长",
            title: "传统模式 3 / 4：拉取数 GB 完整镜像并重新挂载工作区",
            text: "新容器启动需重新拉取完整底层镜像、挂载磁盘并执行全套开机预检，耗时显著高于轻量级产物包热更新。",
            boxes: ["box-store", "box-sup", "box-slot"],
            lines: ["line-store-slot"],
            labels: {
              "sup-l1": "等待容器冷启动完成",
              "agent-title": "重新执行全量开机初始化",
              "agent-l1": "拉取全量镜像层而非轻量增量包",
              "agent-l2": "重新挂载磁盘与预装仓库"
            }
          },
          {
            btnLabel: "4. 恢复服务",
            color: "#0969da",
            pillBg: "#ddf4ff",
            pillText: "🔁 传统模式 Step 4：全量冷启动完成后才重新对外提供服务",
            title: "传统模式 4 / 4：冷启动完毕后恢复服务",
            text: "相比秒级软链热更新接力，传统整机重建模式虽然能完成升级，但升级窗口期长且无法保持容器级常驻体验。",
            boxes: ["box-ctrl", "box-agent", "box-engine", "box-worker"],
            lines: ["line-ctrl-agent", "line-agent-engine", "line-engine-worker"],
            labels: {
              "sup-l1": "新容器进程树启动完成",
              "agent-title": "新容器 Runner 上线",
              "agent-l1": "重新向控制面注册",
              "agent-l2": "恢复任务调度"
            }
          }
        ]
      }
    ];

    const ALL_BOXES = ["box-ctrl", "box-store", "box-sup", "box-agent", "box-engine", "box-slot", "box-shared", "box-worker"];
    const ALL_LINES = ["line-ctrl-agent", "line-store-slot", "line-sup-agent", "line-agent-engine", "line-slot-sup", "line-agent-shared", "line-shared-worker", "line-engine-worker"];
    const DEFAULT_LABELS = {};
    ["ctrl-l1", "ctrl-l2", "ctrl-l3", "store-l1", "store-l2", "sup-l1", "agent-title", "agent-l1", "agent-l2", "engine-l1", "slot-l1", "shared-l1", "shared-l2", "worker-l1"].forEach(id => {
      const el = document.getElementById(id);
      if (el) DEFAULT_LABELS[id] = el.textContent;
    });

    let modeIdx = 0;
    let stepIdx = 0;
    let timer = null;

    function buildButtons() {
      const modeContainer = document.getElementById("mode-switch");
      if (MODES.length <= 1) {
        modeContainer.classList.add("hidden");
      } else {
        modeContainer.classList.remove("hidden");
        modeContainer.innerHTML = "";
        MODES.forEach((m, idx) => {
          const btn = document.createElement("button");
          btn.className = "mode-btn";
          btn.textContent = m.label;
          btn.onclick = () => switchMode(idx, true);
          modeContainer.appendChild(btn);
        });
      }

      const stepContainer = document.getElementById("step-btns");
      stepContainer.innerHTML = "";
      MODES[modeIdx].steps.forEach((s, idx) => {
        const btn = document.createElement("button");
        btn.className = "step-btn";
        btn.textContent = s.btnLabel;
        btn.onclick = () => selectStep(idx, true);
        stepContainer.appendChild(btn);
      });
    }

    function render() {
      const mode = MODES[modeIdx];
      const step = mode.steps[stepIdx];

      // Update mode buttons
      const modeBtns = document.querySelectorAll("#mode-switch .mode-btn");
      modeBtns.forEach((btn, idx) => {
        if (idx === modeIdx) {
          btn.style.background = mode.activeBg;
          btn.style.color = mode.activeColor;
          btn.style.boxShadow = "0 1px 2px rgba(27, 31, 36, 0.08)";
        } else {
          btn.style.background = "transparent";
          btn.style.color = "#57606a";
          btn.style.boxShadow = "none";
        }
      });

      // Update step buttons
      const stepBtns = document.querySelectorAll("#step-btns .step-btn");
      stepBtns.forEach((btn, idx) => {
        if (idx === stepIdx) {
          btn.style.background = step.color;
          btn.style.borderColor = step.color;
          btn.style.color = "#ffffff";
          btn.style.fontWeight = "600";
        } else {
          btn.style.background = "#ffffff";
          btn.style.borderColor = "#d0d7de";
          btn.style.color = "#57606a";
          btn.style.fontWeight = "500";
        }
      });

      // Update top SVG pill banner
      const pillBg = document.getElementById("top-pill-bg");
      const pillText = document.getElementById("top-pill-text");
      pillBg.setAttribute("fill", step.pillBg);
      pillBg.setAttribute("stroke", step.color);
      pillText.setAttribute("fill", step.color);
      pillText.textContent = step.pillText;

      // Update description box
      const descBox = document.getElementById("desc-box");
      const descTitle = document.getElementById("desc-title");
      const descText = document.getElementById("desc-text");
      descBox.style.borderLeftColor = step.color;
      descTitle.style.color = step.color;
      descTitle.textContent = step.title;
      descText.textContent = step.text;

      // Update dynamic node labels (reset to defaults first)
      Object.keys(DEFAULT_LABELS).forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = (step.labels && step.labels[id]) || DEFAULT_LABELS[id];
      });

      // Highlight active boxes
      ALL_BOXES.forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        const active = step.boxes.includes(id);
        el.setAttribute("fill", active ? step.pillBg : "#ffffff");
        el.setAttribute("stroke", active ? step.color : "#d0d7de");
        el.setAttribute("stroke-width", active ? "2" : "1.5");
      });

      // Highlight active connector lines
      ALL_LINES.forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        const active = step.lines.includes(id);
        el.setAttribute("opacity", active ? "1" : "0.22");
        el.classList.toggle("anim-dash", active);
      });
    }

    function selectStep(idx, manual) {
      stepIdx = idx;
      if (manual && timer) {
        clearInterval(timer);
        timer = null;
        document.getElementById("play-status").textContent = "手动浏览";
      }
      render();
    }

    function switchMode(idx, manual) {
      modeIdx = idx;
      stepIdx = 0;
      if (manual && timer) {
        clearInterval(timer);
        timer = null;
        document.getElementById("play-status").textContent = "手动浏览";
      }
      buildButtons();
      render();
    }

    buildButtons();
    render();
    timer = setInterval(() => {
      const stepsLen = MODES[modeIdx].steps.length;
      if (stepIdx + 1 < stepsLen) {
        stepIdx += 1;
      } else if (MODES.length > 1) {
        modeIdx = (modeIdx + 1) % MODES.length;
        stepIdx = 0;
        buildButtons();
      } else {
        stepIdx = 0;
      }
      render();
    }, 3800);
  </script>
</body>
</html>
